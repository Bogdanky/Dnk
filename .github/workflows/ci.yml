name: CI
on:
  push:
    branches: [main, security-reliability]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
